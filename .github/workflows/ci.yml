name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install steps must not need a registry token; CI never calls paid APIs or YouTube.
  CI: "true"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI has no copy of the old shorts repo; the test also skips itself when it is absent.
      SKIP_OLD_SHORTS: "1"
      # The chaos harness defaults to 200 seeds locally; CI runs a reduced sweep to keep the job short.
      CHAOS_SEEDS: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg (host ffprobe is used by render tests)
        # The apt mirror sometimes stalls for ~28 minutes, which used up the whole job timeout while the tests
        # themselves need ~8. Each attempt is capped, and a stalled one is retried.
        timeout-minutes: 8
        run: |
          if ! command -v ffprobe >/dev/null; then
            for attempt in 1 2 3; do
              if sudo timeout 150 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update \
                && sudo timeout 200 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg; then
                break
              fi
              echo "apt attempt $attempt failed or stalled"
              [ "$attempt" = 3 ] && exit 1
              sleep 5
            done
          fi
          ffprobe -version
      - name: Build sandbox images
        run: |
          npm run image:render
          npm run image:egress-proxy
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    # next build + next start + the auth suites (workers: 1 on purpose) take a while.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report
            test-results

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every Dockerfile under infra/ must be named Dockerfile.<name>
        run: |
          bad=$(find infra -type f -name 'Dockerfile*' ! -name 'Dockerfile.?*')
          if [ -n "$bad" ]; then
            echo "These do not match infra/Dockerfile.<name> and would not be built or checked:"
            echo "$bad"
            exit 1
          fi
      - name: Build our images and check for python
        run: |
          shopt -s nullglob
          images=()
          for f in infra/Dockerfile.*; do
            tag="ytstudio-${f##*Dockerfile.}"
            docker build -f "$f" -t "$tag" .
            images+=("$tag")
          done
          if [ ${#images[@]} -eq 0 ]; then echo "no images yet"; exit 1; fi
          bash infra/check-no-python.sh "${images[@]}"
