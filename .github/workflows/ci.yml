name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install steps must not need a registry token; CI never calls paid APIs or YouTube.
  CI: "true"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Install ffprobe for fake-video fixture tests
        timeout-minutes: 8
        run: |
          sudo timeout 200 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
          ffprobe -version
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # CI has no copy of the old shorts repo; the test also skips itself when it is absent.
      SKIP_OLD_SHORTS: "1"
      # The chaos harness defaults to 200 seeds locally; CI runs a reduced sweep to keep the job short.
      CHAOS_SEEDS: "60"
      ENGINE_CHAOS_SEEDS: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build sandbox images
        run: |
          npm run image:render
          npm run image:egress-proxy
      - name: Host ffprobe (render tests probe videos on the host)
        # apt-get install ffmpeg pulls ~100 packages from the runner's mirror, which sometimes crawls (one run lost 28
        # minutes of the 30 minute budget; the tests themselves need ~8). The render image already contains Remotion's
        # self-contained ffprobe (plus its own libs), so copy that out; apt is only the fallback.
        timeout-minutes: 8
        run: |
          dir=$(docker run --rm --entrypoint sh ytstudio-render:dev -c 'dirname "$(find /opt/render/node_modules/@remotion -name ffprobe -type f | head -1)"')
          cid=$(docker create ytstudio-render:dev)
          docker cp "$cid:$dir" "$HOME/ffprobe-bin"
          docker rm "$cid" >/dev/null
          echo "$HOME/ffprobe-bin" >> "$GITHUB_PATH"
          if ! "$HOME/ffprobe-bin/ffprobe" -version; then
            echo "bundled ffprobe unusable, falling back to apt"
            sudo timeout 200 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
            sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends ffmpeg
            ffprobe -version
          fi
      - name: Run integration suites without starving engine workers
        run: |
          npm run test:integration -- --exclude tests/integration/engine-resilience.test.ts --exclude tests/integration/engine-chaos.test.ts
          npm run test:integration -- --run tests/integration/engine-resilience.test.ts
          npm run test:integration -- --run tests/integration/engine-chaos.test.ts

  e2e:
    runs-on: ubuntu-latest
    # next build + next start + the auth suites (workers: 1 on purpose) take a while.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report
            test-results

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every Dockerfile under infra/ must be named Dockerfile.<name>
        run: |
          bad=$(find infra -type f -name 'Dockerfile*' ! -name 'Dockerfile.?*')
          if [ -n "$bad" ]; then
            echo "These do not match infra/Dockerfile.<name> and would not be built or checked:"
            echo "$bad"
            exit 1
          fi
      - name: Build our images and check for python
        run: |
          shopt -s nullglob
          images=()
          for f in infra/Dockerfile.*; do
            tag="ytstudio-${f##*Dockerfile.}"
            docker build -f "$f" -t "$tag" .
            images+=("$tag")
          done
          if [ ${#images[@]} -eq 0 ]; then echo "no images yet"; exit 1; fi
          bash infra/check-no-python.sh "${images[@]}"
