name: ci

on:
  push:
  pull_request:

env:
  # Install steps must not need a registry token; CI never calls paid APIs or YouTube.
  CI: "true"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report
            test-results

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build our images and check for python
        run: |
          shopt -s nullglob
          images=()
          for f in infra/Dockerfile.*; do
            tag="ytstudio-${f##*Dockerfile.}"
            docker build -f "$f" -t "$tag" .
            images+=("$tag")
          done
          if [ ${#images[@]} -eq 0 ]; then echo "no images yet"; exit 0; fi
          bash infra/check-no-python.sh "${images[@]}"
