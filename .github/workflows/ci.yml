name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Install steps must not need a registry token; CI never calls paid APIs or YouTube.
  CI: "true"

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    env:
      # CI has no copy of the old shorts repo; the test also skips itself when it is absent.
      SKIP_OLD_SHORTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg (host ffprobe is used by render tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version
      - name: Build sandbox images
        run: |
          npm run image:render
          npm run image:egress-proxy
      - run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright
          path: |
            playwright-report
            test-results

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every Dockerfile under infra/ must be named Dockerfile.<name>
        run: |
          bad=$(find infra -type f -name 'Dockerfile*' ! -name 'Dockerfile.?*')
          if [ -n "$bad" ]; then
            echo "These do not match infra/Dockerfile.<name> and would not be built or checked:"
            echo "$bad"
            exit 1
          fi
      - name: Build our images and check for python
        run: |
          shopt -s nullglob
          images=()
          for f in infra/Dockerfile.*; do
            tag="ytstudio-${f##*Dockerfile.}"
            docker build -f "$f" -t "$tag" .
            images+=("$tag")
          done
          if [ ${#images[@]} -eq 0 ]; then echo "no images yet"; exit 1; fi
          bash infra/check-no-python.sh "${images[@]}"
