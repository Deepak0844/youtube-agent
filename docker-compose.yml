# The whole studio: `npm run compose:up` (writes .env, builds, starts). See README "Run everything in Docker" and docs/adr/0016.
# Who may do what: only the worker has the host's Docker socket (it starts the locked-down render container per video);
# the web app never does. Postgres, Redis and SearXNG publish no ports; web publishes loopback only.

x-env: &env
  DATABASE_URL: postgres://ytstudio_app:${YTSTUDIO_APP_PASSWORD}@postgres:5432/ytstudio
  BACKUP_DATABASE_URL: postgres://ytstudio_backup:${YTSTUDIO_BACKUP_PASSWORD}@postgres:5432/ytstudio # read-only: backups only (the app role is locked out of some sequences on purpose)
  REDIS_URL: redis://redis:6379
  SEARXNG_URL: http://searxng:8080
  STORAGE_ROOT: /data
  RENDER_IMAGE: ${RENDER_IMAGE:-ytstudio-render:dev}
  VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
  APP_URL: ${APP_URL:-http://localhost:3000}
  OWN_SERVICE_PORTS: ${WEB_PORT:-3000} # the published web port is this app: never a listable local service

x-app: &app
  image: ytstudio-app:dev
  build:
    context: .
    dockerfile: infra/Dockerfile.app
    args:
      APP_UID: ${APP_UID}
      APP_GID: ${APP_GID}
  user: "${APP_UID}:${APP_GID}"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  extra_hosts: ["host.docker.internal:host-gateway"] # a service on this machine (VoiceStudio, Ollama) is host.docker.internal:<port>
  restart: unless-stopped

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ytstudio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ytstudio"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine # the job queue only; Postgres decides what runs, so nothing here needs to survive a restart
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # One-shot first-run setup: database roles, migrations, the owner's one-time setup link (docker compose logs init).
  init:
    <<: *app
    restart: "no"
    command: ["npm", "run", "compose:init"]
    environment:
      <<: *env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      YTSTUDIO_OWNER_PASSWORD: ${YTSTUDIO_OWNER_PASSWORD}
      YTSTUDIO_APP_PASSWORD: ${YTSTUDIO_APP_PASSWORD}
      YTSTUDIO_BACKUP_PASSWORD: ${YTSTUDIO_BACKUP_PASSWORD}
      BOOTSTRAP_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/ytstudio
      MIGRATE_DATABASE_URL: postgres://ytstudio_owner:${YTSTUDIO_OWNER_PASSWORD}@postgres:5432/ytstudio
    volumes:
      - ${HOST_STORAGE_ROOT}:/data # audio:import writes the sound library here for the worker
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: ["npm", "run", "start:container"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      <<: *env
      TOOLS_CHECKED_BY: worker # this container has no Docker access; System status shows what the worker last saw
    volumes:
      - claude-home:/home/app
      - ${HOST_STORAGE_ROOT}:/data
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_started

  worker:
    <<: *app
    command: ["npm", "run", "worker:container"]
    networks: [default, render]
    environment:
      <<: *env
      # Renders go through the render service: this container has no Docker socket and no Docker CLI.
      RENDER_RUNNER_URL: http://render-runner:4100
      RENDER_RUNNER_TOKEN: ${RENDER_RUNNER_TOKEN}
    volumes:
      - claude-home:/home/app
      - ${HOST_STORAGE_ROOT}:/data
    depends_on:
      init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      render-runner:
        condition: service_healthy

  # The only service with the Docker socket. It accepts a validated job description, never docker arguments, and holds no secret:
  # no database, no vault key, no Claude login. It sits on the private `render` network with the worker and nothing else.
  render-runner:
    build:
      context: .
      dockerfile: infra/Dockerfile.render-runner
    image: ytstudio-render-runner:dev
    restart: unless-stopped
    networks: [render]
    group_add: ["${DOCKER_GID}"] # the docker socket's group, so the non-root user may use it
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    environment:
      RENDER_IMAGE: ${RENDER_IMAGE:-ytstudio-render:dev}
      HOST_STORAGE_ROOT: ${HOST_STORAGE_ROOT} # the host-side path of /data: the prefix of every render mount
      RENDER_RUNNER_TOKEN: ${RENDER_RUNNER_TOKEN}
    volumes:
      - ${HOST_STORAGE_ROOT}:/data:ro # only to check that a job's folders are real folders inside it; never written
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/v1/info',{headers:{authorization:'Bearer '+process.env.RENDER_RUNNER_TOKEN}}).then((r)=>r.json()).then((j)=>process.exit(j.ready?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  render:
    internal: true # no route out: the service needs none (the socket is a file), and a render job cannot reach anything through it

volumes:
  pgdata:
  claude-home:
